<style>
:root {
  color-scheme: light;
  --red: #C30013; --red-soft: #FBEAEC; --graphite: #3F3F3F; --on-graphite: #FFFFFF; --strong: #2B2B2B;
  --bg: #F2F2F2; --card: #FFFFFF; --line: #DADADA; --line2: #EEEEEE; --text: #222; --muted: #6B6B6B;
  --chip: #EDEDED; --press: #E6E6E6; --disabled: #EFEFEF; --scrim: rgba(0,0,0,.35); --shadow: 0 1px 3px rgba(0,0,0,.07);
  --green: #2E7D32; --green-soft: #E6F2E7; --amber: #B26A00; --amber-soft: #FFF3DC;
  --logo-bg: transparent; --logo-pad: 0;
}
/* тёмная тема: по настройке телефона или кнопкой в шапке (data-theme) */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --red: #E5323F; --red-soft: #3B1519; --graphite: #4A4A4A; --on-graphite: #FFFFFF; --strong: #F2F2F2;
    --bg: #121212; --card: #1E1E1E; --line: #343434; --line2: #2A2A2A; --text: #EAEAEA; --muted: #9E9E9E;
    --chip: #2C2C2C; --press: #2E2E2E; --disabled: #262626; --scrim: rgba(0,0,0,.6); --shadow: none;
    --green: #6CC070; --green-soft: #1A2E1C; --amber: #FFB547; --amber-soft: #3A2C12;
    --logo-bg: #FFFFFF; --logo-pad: 3px 6px;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --red: #E5323F; --red-soft: #3B1519; --graphite: #4A4A4A; --on-graphite: #FFFFFF; --strong: #F2F2F2;
  --bg: #121212; --card: #1E1E1E; --line: #343434; --line2: #2A2A2A; --text: #EAEAEA; --muted: #9E9E9E;
  --chip: #2C2C2C; --press: #2E2E2E; --disabled: #262626; --scrim: rgba(0,0,0,.6); --shadow: none;
  --green: #6CC070; --green-soft: #1A2E1C; --amber: #FFB547; --amber-soft: #3A2C12;
  --logo-bg: #FFFFFF; --logo-pad: 3px 6px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.35 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
body { padding-bottom: env(safe-area-inset-bottom); }
button, input, select, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
img.logo { background: var(--logo-bg); padding: var(--logo-pad); border-radius: 6px; }
header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 3px solid var(--red);
  padding: calc(6px + env(safe-area-inset-top)) 6px 6px 16px; display: flex; align-items: center; gap: 6px; }
header[hidden] { display: none; }
header img { height: 19px; flex: none; }

header .who b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--strong); }
#conn { font-size: 12px; color: var(--muted); white-space: nowrap; }
#conn::before { content: "●"; margin-right: 4px; color: #999; }
#conn.ok::before { color: var(--green); } #conn.wait::before { color: var(--amber); }
.iconbtn { border: 0; background: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px;
  cursor: pointer; color: var(--strong); flex: none; padding: 0; font-size: 20px; }
.iconbtn:active { background: var(--press); }
main { max-width: 720px; margin: 0 auto; padding: 12px 16px 120px; }
h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 22px 0 10px;
  display: flex; align-items: center; gap: 8px; }
h2 .n { background: var(--graphite); color: var(--on-graphite); border-radius: 10px; padding: 0 8px; font-size: 13px; letter-spacing: 0; }
h2 .n.red { background: var(--red); color: #fff; }
.shift { background: var(--graphite); color: var(--on-graphite); border-radius: 12px; padding: 11px 14px; display: flex;
  justify-content: space-between; align-items: center; font-size: 15px; }
.shift small { opacity: .75; font-size: 15px; }
.big { width: 100%; border: 0; border-radius: 14px; background: var(--red); color: #fff; font-size: 19px; font-weight: 600;
  min-height: 58px; padding: 14px; margin-top: 12px; cursor: pointer; box-shadow: 0 2px 8px rgba(195,0,19,.25); }
.big:active { transform: scale(.99); filter: brightness(.95); }
/* карточка машины */
.card { background: var(--card); border: 1px solid var(--line); border-left-width: 6px; border-radius: 14px; padding: 12px 12px 12px 6px;
  margin-bottom: 10px; display: flex; gap: 10px; cursor: pointer; box-shadow: var(--shadow); }
.card:active { background: var(--press); }
.card.open { border-left-color: var(--red); }
.card.closed { border-left-color: var(--green); }
.card.ready { border-left-color: var(--amber); }
.card.new { box-shadow: 0 0 0 2px var(--red); }
.card .gar { flex: none; width: 74px; align-self: center; text-align: center; font-size: 30px; font-weight: 800; line-height: 1.05;
  color: var(--strong); letter-spacing: -.01em; }
.card .gar small { display: block; margin-top: 4px; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.card .body { flex: 1; min-width: 0; }
.card .top { display: flex; gap: 8px; align-items: baseline; }
.card .kind { font-weight: 700; color: var(--strong); flex: none; }
.card .mech { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .crew { margin-left: auto; flex: none; display: flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 600; color: var(--muted); }
.card .crew svg { width: 16px; height: 16px; }
.card .st { font-size: 15px; font-weight: 600; margin-top: 3px; }
.card .st.open { color: var(--red); } .card .st.done { color: var(--green); } .card .st.wait { color: var(--amber); }
.card .st span { font-size: 14px; font-weight: 400; color: var(--muted); }
.card .txt { font-size: 14px; margin-top: 5px; white-space: pre-line; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }

.badge.amber { background: var(--amber-soft); color: var(--amber); }
.empty { color: var(--muted); text-align: center; padding: 20px; border: 1px dashed var(--line); border-radius: 14px; font-size: 14px; }

#nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line);

#nav[hidden] { display: none; }
#nav button { position: relative; border: 0; background: none; min-height: 60px; padding: 8px 0 7px; display: grid; justify-items: center;

#nav button.on { color: var(--red); font-weight: 600; }
#nav .n { position: absolute; top: 5px; left: calc(50% + 7px); min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--red);
  color: #fff; font-size: 11px; line-height: 18px; font-weight: 600; }
#nav .n.dim { background: var(--graphite); color: var(--on-graphite); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; min-height: 46px; padding: 10px 14px; cursor: pointer; font-size: 15px; }
.btn:active { filter: brightness(.94); }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
.btn.dark { background: var(--graphite); border-color: var(--graphite); color: var(--on-graphite); }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: 14px; }
.btn:disabled { opacity: .5; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.list > div { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line2); flex-wrap: wrap; }
.list > div:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 140px; }
.off { opacity: .45; }
/* форма */
#sheet { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
#sheet[hidden] { display: none; }
.panel { background: var(--bg); width: 100%; max-width: 720px; max-height: 100%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 0 16px; }
.panel .head { position: sticky; top: 0; background: var(--bg); padding: 12px 0 8px; display: flex; align-items: center; gap: 8px; z-index: 2; }
.panel .head b { font-size: 19px; color: var(--strong); }
.panel .head .iconbtn { margin-left: auto; }
label.f { display: block; margin: 14px 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.inp { width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; background: var(--card); font-size: 16px; }
textarea.inp { min-height: 74px; resize: vertical; }
.inp:focus { outline: 2px solid var(--graphite); border-color: transparent; }
.inp:disabled { background: var(--disabled); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 44px; border: 1px solid var(--line); background: var(--card); border-radius: 22px; padding: 9px 16px; cursor: pointer; font-size: 15px; }
.chip.on { background: var(--graphite); color: var(--on-graphite); border-color: var(--graphite); }
.chip:disabled { opacity: .55; }
.gars { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 8px; margin-top: 8px; max-height: 208px; overflow-y: auto; }
.gars button { min-height: 48px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; font-size: 17px; font-weight: 700; cursor: pointer; }
.gars button.busy { border-color: var(--red); color: var(--red); background: var(--red-soft); }
.gars button.on { background: var(--graphite); border-color: var(--graphite); color: var(--on-graphite); }
.seg { display: grid; grid-template-columns: repeat(6, 1fr); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
.seg button { border: 0; border-left: 1px solid var(--line2); background: none; min-height: 46px; font-size: 17px; font-weight: 600; cursor: pointer;
  transition: background .15s, color .15s; }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--graphite); color: var(--on-graphite); }
.seg button:disabled { opacity: .55; }
.timebox { display: flex; gap: 8px; } .timebox .inp { flex: 1; min-width: 0; }
.warn { background: var(--amber-soft); color: var(--amber); border-radius: 10px; padding: 9px 12px; font-size: 14px; margin-top: 8px; }
details.more { margin-top: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 0 12px; }
details.more summary { list-style: none; display: flex; align-items: baseline; gap: 8px; min-height: 48px; padding: 13px 0; cursor: pointer; font-weight: 600; color: var(--strong); }
details.more summary::-webkit-details-marker { display: none; }
details.more summary small { color: var(--muted); font-weight: 400; font-size: 13px; }
details.more summary::after { content: "▾"; margin-left: auto; color: var(--muted); }
details.more[open] summary::after { content: "▴"; }
details.more[open] { padding-bottom: 12px; }
details.more label.f:first-of-type { margin-top: 0; }
.actions { display: flex; gap: 8px; margin-top: 18px; } .actions .btn { flex: 1; min-height: 54px; font-size: 17px; }
.actions.bar { position: sticky; bottom: 0; z-index: 2; background: var(--bg); border-top: 1px solid var(--line);
  margin: 18px -16px 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.panel > :last-child:not(.bar) { margin-bottom: calc(16px + env(safe-area-inset-bottom)); }
/* вход */
.login { max-width: 420px; margin: 0 auto; padding: 24px 16px; text-align: center; }
.login img { height: 40px; margin: 16px 0 6px; }
.login h1 { font-size: 21px; margin: 6px 0 18px; color: var(--strong); }
.names { display: grid; gap: 8px; text-align: left; margin-top: 12px; }
.names button { border: 1px solid var(--line); background: var(--card); border-radius: 12px; min-height: 52px; padding: 13px 14px; font-size: 17px; cursor: pointer;
  display: flex; justify-content: space-between; }
.names button small { color: var(--muted); }
.dots { display: flex; justify-content: center; gap: 16px; margin: 20px 0; }
.dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--strong); }
.dots i.on { background: var(--strong); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 0 auto; }
.pad button { border: 1px solid var(--line); background: var(--card); border-radius: 16px; min-height: 62px; font-size: 25px; cursor: pointer; }
.pad button:active { background: var(--press); }
.err { color: var(--red); min-height: 22px; margin-top: 10px; font-size: 15px; }
.login .sub { color: var(--muted); font-size: 15px; margin: -8px 0 6px; }
.link { border: 0; background: none; color: var(--muted); font-size: 15px; padding: 10px; margin-top: 6px; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
.done { width: 72px; height: 72px; margin: 28px auto 8px; border-radius: 50%; display: grid; place-items: center;
  background: var(--green-soft); color: var(--green); animation: pop .45s cubic-bezier(.2,.8,.2,1.2) both; }
.done svg.i { width: 36px; height: 36px; stroke-width: 2.4; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
/* заставка при запуске: логотип проявляется, под ним бежит тонкая красная полоса */
#splash { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--bg);
  transition: opacity .4s ease, visibility .4s; }
#splash.out { opacity: 0; visibility: hidden; }
#splash .sp { display: grid; justify-items: center; gap: 20px; animation: spIn .7s cubic-bezier(.2,.7,.2,1) both; }
#splash img { height: 34px; }
#splash .bar { position: relative; width: 132px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
#splash .bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 2px; background: var(--red);
  animation: spRun 1.1s cubic-bezier(.65,0,.35,1) infinite; }
#splash .t { font-size: 12px; letter-spacing: .32em; padding-left: .32em; text-transform: uppercase; color: var(--muted); }
@keyframes spIn { from { opacity: 0; transform: translateY(10px) scale(.97); } }
@keyframes spRun { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) { #splash .sp, #splash .bar i, .done { animation: none; } }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30;
  display: grid; gap: 6px; width: min(92vw, 520px); pointer-events: none; }
#nav:not([hidden]) ~ #toast { bottom: calc(74px + env(safe-area-inset-bottom)); }
#sheet:not([hidden]) ~ #toast { bottom: auto; top: calc(10px + env(safe-area-inset-top)); }   /* не закрывать кнопки формы */
#toast div { background: #333; color: #fff; border-radius: 12px; padding: 11px 14px; font-size: 15px; box-shadow: 0 4px 14px rgba(0,0,0,.3);
  border-left: 5px solid var(--red); animation: up .25s ease; }
#toast div.bad { background: #C30013; border-left-color: #7a0010; }
@keyframes up { from { transform: translateY(12px); opacity: 0; } }
.hint { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 14px; margin-top: 12px;
  display: flex; gap: 8px; align-items: center; }
.hint .grow { flex: 1; }
</style>

function toast(msg, bad) {
  const el = document.createElement("div"); el.textContent = msg; if (bad) el.className = "bad";
  $("#toast").appendChild(el); setTimeout(() => el.remove(), bad ? 6000 : 4000);
}
let audioCtx = null;
function beep() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.18, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
    o.start(); o.stop(audioCtx.currentTime + 0.36); } catch {}
}
async function sysNotify(title, body) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try { const reg = await navigator.serviceWorker?.getRegistration(); if (reg) reg.showNotification(title, { body, icon: "icon-192.png", tag: title, renotify: true });
    else new Notification(title, { body, icon: "icon-192.png" }); } catch {}
}
function announce(row, prev) {
  if (!S.me || row.mechanic_id === S.me.id) return;
  const what = !prev ? "заезд" : (!prev.ended_at && row.ended_at) ? "выезд" : (!prev.ready_at && row.ready_at) ? "готова, ждёт: " + (row.wait_reason || "—").toLowerCase() : "дополнено";
  const msg = `${row.gar} — ${what}${row.mechanic_name ? " · " + row.mechanic_name : ""}`;
  toast(msg); beep(); navigator.vibrate?.([120, 60, 120]);
  if (document.hidden) sysNotify("Ремзона: " + msg, [row.kind, row.fault || row.work].filter(Boolean).join(" · "));
  document.title = `(${newCount()}) Ремзона ГЕ`;
}

// ---------- очередь записи (без связи копится, уходит при появлении) ----------
function saveQ() { save("rz_queue", S.queue); renderConn(); }
function enqueue(cid, data, isNew, id) {
  const ex = S.queue.find((q) => q.cid === cid);
  if (ex) Object.assign(ex.data, data); else S.queue.push({ cid, id, isNew, data });
  saveQ(); render(); flush();
}
async function flush() {
  if (S.flushing || !S.queue.length || !S.me) return;
  S.flushing = true;
  try {
    while (S.queue.length) {
      const q = S.queue[0]; let res;
      if (q.isNew) res = await sb.from("jobs").upsert({ ...q.data, client_id: q.cid }, { onConflict: "client_id" }).select().single();
      else if (q.cid) res = await sb.from("jobs").update(q.data).eq("client_id", q.cid).select().single();
      else res = await sb.from("jobs").update(q.data).eq("id", q.id).select().single();
      if (res.error) {
        if (netErr(res.error)) break;
        toast("Не сохранено (" + (q.data.gar || "") + "): " + res.error.message, true);
      } else { S.jobs.set(res.data.id, res.data); }
      S.queue.shift(); saveQ();
    }
  } finally { S.flushing = false; cacheJobs(); renderConn(); render(); }
}
// записи с учётом неотправленного
function allJobs() {
  const m = new Map(S.jobs);
  for (const q of S.queue) {
    let j = [...m.values()].find((x) => (q.cid && x.client_id === q.cid) || (q.id && x.id === q.id));
    if (j) m.set(j.id, { ...j, ...q.data, pending: true });
    else if (q.isNew) m.set("q:" + q.cid, { id: "q:" + q.cid, client_id: q.cid, mechanic_id: S.me?.id, mechanic_name: S.me?.name,
      rev: 1, imported_rev: 0, updated_at: new Date().toISOString(), ...q.data, pending: true });
  }
  return [...m.values()].filter((j) => !j.deleted);
}
const cacheJobs = () => save("rz_jobs", [...S.jobs.values()]);

// ---------- данные ----------
async function loadAll() {
  const since = new Date(Date.now() - KEEP_DAYS * 86400000).toISOString();
  const [m, j, st, inv] = await Promise.all([
    sb.from("machines").select("*").order("gar"),
    sb.from("jobs").select("*").eq("deleted", false).or(`ended_at.is.null,updated_at.gte.${since}`).order("started_at", { ascending: false }).limit(500),
    isAdmin() ? sb.from("staff").select("*").order("role", { ascending: false }).order("name") : Promise.resolve({ data: [] }),
    isAdmin() ? sb.from("invite").select("code").maybeSingle() : Promise.resolve({ data: null }),
  ]);
  S.invite = inv.data?.code || "";
  if (m.error || j.error) throw (m.error || j.error);
  S.machines = m.data; save("rz_machines", S.machines);
  S.jobs = new Map(j.data.map((x) => [x.id, x])); cacheJobs();
  S.staff = st.data || [];
}
function subscribe() {
  if (S.channel) sb.removeChannel(S.channel);
  S.channel = sb.channel("jobs-" + uuid()).on("postgres_changes", { event: "*", schema: "public", table: "jobs" }, (p) => {
    if (p.eventType === "DELETE") { S.jobs.delete(p.old?.id); }
    else {
      const row = p.new, prev = S.jobs.get(row.id);
      if (row.deleted) S.jobs.delete(row.id); else S.jobs.set(row.id, row);
      if (!row.deleted && (!prev || prev.rev !== row.rev)) announce(row, prev);
    }
    cacheJobs(); render();
  }).subscribe((status) => { S.rt = status; renderConn(); });
}

function card(j, opts = {}) {
  const m = S.machines.find((x) => x.gar === j.gar);
  const open = !j.ended_at;
  const isNew = opts.feed && j.mechanic_id !== S.me.id && new Date(j.updated_at).getTime() > S.seen;
  const ready = !!j.ready_at, why = esc((j.wait_reason || "").toLowerCase());

    : `<div class="st done">Выехала ${when(j.ended_at)} <span>· ${ready ? `ремонт ${dur(j.started_at, j.ready_at)}` : `стояла ${dur(j.started_at, j.ended_at)}`}</span></div>`;
  const txt = [j.fault && "⚠ " + j.fault, j.work && "✔ " + j.work].filter(Boolean).join("\n");
  const b = [];
  if (j.pending) b.push(`<span class="badge amber">ждёт отправки</span>`);
  if (isAdmin() && !j.pending) b.push(j.rev > j.imported_rev ? `<span class="badge red">не в таблице</span>` : `<span class="badge green">в таблице</span>`);
  if (isNew) b.push(`<span class="badge red">новое</span>`);
  if (ready && !open) b.push(`<span class="badge amber">ожидание ${dur(j.ready_at, j.ended_at)}${why ? ` — ${why}` : ""}</span>`);
  if (j.moto) b.push(`<span class="badge">м/ч ${esc(j.moto)}</span>`);

  return `<div class="card ${open ? (ready ? "ready" : "open") : "closed"} ${isNew ? "new" : ""}" data-act="job" data-id="${esc(j.id)}">
    <div class="gar">${esc(j.gar)}<small>${esc(m?.model || "")}</small></div>
    <div class="body"><div class="top"><span class="kind">${esc(j.kind)}</span><span class="mech">${esc(j.mechanic_name || "—")}</span>${j.crew ? `<span class="crew" title="Человек на работе">${svg(ICON.people)}${j.crew}</span>` : ""}</div>
    ${st}${txt ? `<div class="txt">${esc(txt)}</div>` : ""}
    ${b.length ? `<div class="badges">${b.join("")}</div>` : ""}</div></div>`;

function installHint() {

          <span class="grow"><b>${esc(s.name)}</b><br><small style="color:var(--muted)">механик · ждёт подтверждения</small></span>

// ---------- карточка заезда ----------

  const j = id ? allJobs().find((x) => x.id === id) : null;
  const can = !j || isAdmin() || j.mechanic_id === S.me.id;
  S.edit = { j, can, gar: j?.gar || "", kind: j?.kind || "Ремонт", crew: j?.crew || 1 };
  const dis = can ? "" : "disabled";
  // при заезде нужны только номер, вид, время и неисправность -- остальное свёрнуто
  const more = `<label class="f">Что сделано</label><textarea class="inp" id="fWork" ${dis}>${esc(j?.work)}</textarea>
    <label class="f">Моточасы</label><input class="inp" id="fMoto" inputmode="decimal" value="${esc(j?.moto ?? "")}" ${dis}>
    <label class="f">Запчасти / ТМЦ</label><textarea class="inp" id="fTmc" style="min-height:52px" ${dis}>${esc(j?.tmc)}</textarea>
    <label class="f">Примечание</label><input class="inp" id="fNote" value="${esc(j?.note)}" ${dis}>`;
  // ремонт закончен, машина ждёт не по нашей вине -- время готовности и причина (в таблицу -- примечанием)
  const wr = j?.wait_reason || "", other = !!wr && !WAITS.includes(wr);
  S.edit.wait = other ? "Другое" : wr;
  const readySec = j ? `<label class="f">Готова к выезду — ждёт не по нашей вине</label>
    <div class="chips" id="fWait">${[...WAITS, "Другое"].map((w) => `<button class="chip ${w === S.edit.wait ? "on" : ""}" data-act="wait" data-v="${w}" ${dis}>${w}</button>`).join("")}</div>
    <input class="inp" id="fWaitOther" style="margin-top:8px" placeholder="Чего ждёт машина" value="${other ? esc(wr) : ""}" ${dis} ${S.edit.wait === "Другое" ? "" : "hidden"}>
    <div class="timebox" style="margin-top:8px"><input class="inp" type="datetime-local" id="fReady" value="${toInput(j.ready_at)}" ${dis}>
      <button class="btn" data-act="unready" ${dis}>Не ждёт</button></div>` : "";
  $("#panel").innerHTML = `<div class="head"><b>${j ? "Машина " + esc(j.gar) : "Заезд машины"}</b>
      ${j ? `<span class="badge">${esc(j.mechanic_name || "")}</span>` : ""}<button class="iconbtn" data-act="close">✕</button></div>
    ${can ? "" : `<div class="warn">Запись другого механика — только просмотр.</div>`}
    <label class="f">Гаражный номер</label>
    <input class="inp" id="fGar" inputmode="numeric" placeholder="Начните вводить номер" value="${esc(S.edit.gar)}" ${dis} autocomplete="off">
    <div class="gars" id="garGrid"></div><div id="garWarn"></div>
    <label class="f">Вид работ</label>
    <div class="chips" id="fKind">${KINDS.map((k) => `<button class="chip ${k === S.edit.kind ? "on" : ""}" data-act="kind" data-v="${k}" ${dis}>${k}</button>`).join("")}</div>
    <div class="chips" id="toChips" style="margin-top:6px"></div>
    <label class="f">Сколько человек работает</label>
    <div class="seg" id="fCrew">${[1, 2, 3, 4, 5, 6].map((n) => `<button class="${n === S.edit.crew ? "on" : ""}" data-act="crew" data-v="${n}" ${dis}>${n}</button>`).join("")}</div>
    <label class="f">Время заезда</label>
    <div class="timebox"><input class="inp" type="datetime-local" id="fStart" value="${toInput(j?.started_at || new Date().toISOString())}" ${dis}>
      <button class="btn" data-act="now" data-for="fStart" ${dis}>Сейчас</button></div>
    <label class="f">Неисправность / что выявлено</label><textarea class="inp" id="fFault" ${dis}>${esc(j?.fault)}</textarea>
    ${j ? more : `<details class="more" id="more"><summary>Дополнительно <small>сделано, м/ч, ТМЦ</small></summary>${more}</details>`}
    ${readySec}
    ${j ? `<label class="f">Время выезда</label>
      <div class="timebox"><input class="inp" type="datetime-local" id="fEnd" value="${toInput(j.ended_at)}" ${dis}>
      <button class="btn" data-act="now" data-for="fEnd" ${dis}>Сейчас</button></div>` : ""}
    ${j && isAdmin() ? `<div class="actions"><button class="btn small" data-act="deljob">Удалить запись</button></div>` : ""}
    ${can ? `<div class="actions bar">${j ? `${!j.ended_at ? `<button class="btn dark" data-act="exit">Выехала сейчас</button>` : ""}<button class="btn red" data-act="savejob">Сохранить</button>`
      : `<button class="btn red" data-act="savejob">Отметить заезд</button>`}</div>` : ""}`;
  $("#sheet").hidden = false;
  drawGars(); drawTo();
  $("#fGar").addEventListener("input", (e) => { S.edit.gar = e.target.value.replace(/\D/g, ""); e.target.value = S.edit.gar; drawGars(); });
  if (!j) setTimeout(() => $("#fGar").focus(), 50);
}
function drawGars() {
  const e = S.edit, q = e.gar, busy = new Set(allJobs().filter((x) => !x.ended_at && x.id !== e.j?.id).map((x) => x.gar));
  const xs = S.machines.filter((m) => (m.active || m.gar === q) && (!q || m.gar.startsWith(q)));
  $("#garGrid").innerHTML = e.can && !(xs.length === 1 && xs[0].gar === q) ?
    xs.slice(0, 60).map((m) => `<button class="${busy.has(m.gar) ? "busy" : ""} ${m.gar === q ? "on" : ""}" data-act="gar" data-gar="${m.gar}">${m.gar}</button>`).join("") : "";
  const o = busy.has(q) && allJobs().find((x) => !x.ended_at && x.gar === q && x.id !== e.j?.id);
  $("#garWarn").innerHTML = o ? `<div class="warn">Машина ${esc(q)} уже на площадке: заезд ${fmt(o.started_at)}, ${esc(o.mechanic_name || "")}. Лучше дополнить ту запись.</div>`
    : q && !S.machines.some((m) => m.gar === q) ? `<div class="warn">Номера ${esc(q)} нет в списке машин участка.</div>` : "";
}
function drawTo() {
  $("#toChips").innerHTML = S.edit.kind === "ТО" && S.edit.can ?
    [1, 2, 3, 4, 5, 6].map((n) => `<button class="chip" data-act="to" data-v="ТО-${n}">ТО-${n}</button>`).join("") : "";
}
function closeSheet() { $("#sheet").hidden = true; S.edit = null; }
function saveJob(exitNow) {
  const e = S.edit, j = e.j;
  const gar = $("#fGar").value.trim();
  if (!S.machines.some((m) => m.gar === gar)) return toast("Выберите гаражный номер из списка", true);
  const started = fromInput($("#fStart").value);
  if (!started) return toast("Укажите время заезда", true);
  let ended = j ? fromInput($("#fEnd")?.value) : null;
  if (exitNow) ended = new Date().toISOString();
  // таблицы считают по минутам: выезд -- хотя бы на минуту позже заезда
  if (ended && Math.floor(new Date(ended) / 60000) <= Math.floor(new Date(started) / 60000)) return toast("Выезд должен быть позже заезда (хотя бы на минуту)", true);
  if (new Date(started) > new Date(Date.now() + 10 * 60000)) return toast("Время заезда в будущем — проверьте", true);
  const ready = j ? fromInput($("#fReady").value) : null;
  const wait = !ready ? "" : e.wait === "Другое" ? $("#fWaitOther").value.trim() : e.wait;
  if (ready && !wait) return toast("Укажите, чего ждёт машина", true);
  if (ready && new Date(ready) < new Date(started)) return toast("Готовность раньше заезда — проверьте время", true);
  if (ready && ended && new Date(ended) < new Date(ready)) return toast("Выезд раньше готовности — проверьте время", true);
  if (ready && new Date(ready) > new Date(Date.now() + 10 * 60000)) return toast("Время готовности в будущем — проверьте", true);
  const motoS = $("#fMoto").value.replace(",", ".").trim();
  if (motoS && isNaN(+motoS)) return toast("Моточасы — числом", true);
  const data = { gar, kind: e.kind, started_at: started, ended_at: ended, fault: $("#fFault").value.trim(), work: $("#fWork").value.trim(),
    moto: motoS ? +motoS : null, tmc: $("#fTmc").value.trim(), note: $("#fNote").value.trim(), ready_at: ready, wait_reason: wait, crew: e.crew };
  if (!j) {
    const dup = allJobs().find((x) => !x.ended_at && x.gar === gar);
    if (dup && !confirm(`Машина ${gar} уже на площадке (заезд ${fmt(dup.started_at)}). Всё равно создать новую запись?`)) return;
    enqueue(uuid(), data, true);
    toast(`${gar}: заезд отмечен ${hm(new Date(started))}`);
  } else {
    const cid = j.client_id || null;
    enqueue(cid, data, false, j.id.startsWith("q:") ? null : j.id);
    toast(`${gar}: ${exitNow ? "выезд отмечен" : "сохранено"}`);
  }
  closeSheet();
}

// ---------- администратор ----------
async function callAdmin(body) {
  try {
    const { data, error } = await sb.functions.invoke("staff-admin", { body });
    if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch {} return { error: m }; }
    return data;
  } catch (e) { return { error: netErr(e) ? "Нет связи с сервером" : String(e.message || e) }; }
}
// карточка сотрудника -- только у владельца: ФИО, роль, PIN, отключение, удаление

  S.edit = { staff: s, role: s.role };
  $("#panel").innerHTML = `<div class="head"><b>${esc(s.name)}</b>${s.owner ? `<span class="badge">владелец</span>` : ""}<button class="iconbtn" data-act="close">✕</button></div>
    <label class="f">Фамилия И.О. — как в таблицах</label><input class="inp" id="seName" value="${esc(s.name)}">
    <label class="f">Роль</label><div class="chips" id="seRole">${[["mechanic", "Механик"], ["admin", "Администратор"]].map(([v, t]) =>
      `<button class="chip ${s.role === v ? "on" : ""}" data-act="serole" data-v="${v}" ${self ? "disabled" : ""}>${t}</button>`).join("")}</div>

      <div class="actions"><button class="btn" style="color:var(--red);border-color:var(--red)" data-act="delstaff">Удалить сотрудника</button></div>`}`;

async function reloadStaff() { const r = await sb.from("staff").select("*").order("role", { ascending: false }).order("name"); if (!r.error) S.staff = r.data; render(); }
const randPin = () => String(Math.floor(1000 + Math.random() * 9000));

// ---------- действия ----------
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredInstall = e; render(); });
document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("[data-act]"); if (!t || t.disabled) return;
  const a = t.dataset.act;
  if (audioCtx === null) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  switch (a) {
    case "find": findName(); break;
    case "pick": L.pick = L.found.find((x) => x.login === t.dataset.login); L.pin = ""; L.err = ""; renderLogin(); break;
    case "other": L.pick = null; L.found = []; L.q = ""; L.pin = ""; L.err = ""; renderLogin(); break;
    case "digit": if (L.pin.length < 4) { L.pin += t.dataset.d; L.err = ""; renderLogin(); if (L.pin.length === 4) tryPin(); } break;
    case "back": L.pin = L.pin.slice(0, -1); renderLogin(); break;
    case "bootstrap": bootstrap(); break;
    case "signup": signup(); break;
    case "tosignup": L.mode = "signup"; L.err = ""; renderLogin(); break;
    case "tologin": L.mode = ""; L.err = ""; L.pin = ""; renderLogin(); break;
    case "newcode": if (!confirm("Сделать новый код? Старая ссылка перестанет работать (уже зарегистрированных это не касается).")) return;
    // fallthrough
    case "invite": {
      if (!S.invite || a === "newcode") { const r = await callAdmin({ action: "new_code" }); if (r.error) return toast(r.error, true); S.invite = r.code; render(); return toast(`Код ${r.code} готов — нажмите «Поделиться»`); }
      const url = location.origin + location.pathname + "?join=" + S.invite;
      if (navigator.share) navigator.share({ title: "Ремзона ГЕ", text: `Регистрация в приложении «Ремзона ГЕ». Код приглашения: ${S.invite}`, url }).catch(() => {});
      else navigator.clipboard?.writeText(url).then(() => toast("Ссылка скопирована"), () => prompt("Ссылка для сотрудников:", url));
      break; }
    case "approve": case "reject": { const s = S.staff.find((x) => x.id === t.dataset.id);
      if (a === "reject" && !confirm(`Отклонить заявку «${s.name}»?`)) return;
      t.disabled = true; const r = await callAdmin({ action: a, id: s.id }); t.disabled = false;
      toast(r.error || (a === "approve" ? `${s.name}: доступ открыт` : `Заявка «${s.name}» отклонена`), !!r.error); reloadStaff(); break; }
    case "crew": S.edit.crew = +t.dataset.v; document.querySelectorAll("#fCrew button").forEach((c) => c.classList.toggle("on", c === t)); break;
    case "logout": if (confirm("Выйти из приложения?")) { if (S.queue.length && !confirm(`Не отправлено записей: ${S.queue.length}. Они останутся на этом телефоне. Выйти?`)) return;
      if (S.channel) sb.removeChannel(S.channel); await sb.auth.signOut(); localStorage.removeItem("rz_me"); showLogin(); } break;
    case "tab": S.tab = t.dataset.tab; render(); scrollTo(0, 0); break;
    case "theme": save("rz_theme", isDark() ? "light" : "dark"); applyTheme(); break;
    case "new": openJob(null); break;
    case "job": openJob(t.dataset.id); break;
    case "close": closeSheet(); break;
    case "gar": S.edit.gar = t.dataset.gar; $("#fGar").value = S.edit.gar; drawGars(); break;
    case "kind": S.edit.kind = t.dataset.v; document.querySelectorAll("#fKind .chip").forEach((c) => c.classList.toggle("on", c.dataset.v === S.edit.kind)); drawTo(); break;
    case "to": { $("#more")?.setAttribute("open", ""); const w = $("#fWork"); if (!/^ТО-\d/.test(w.value)) w.value = (t.dataset.v + " " + w.value).trim(); else w.value = w.value.replace(/^ТО-\d/, t.dataset.v); break; }
    case "now": $("#" + t.dataset.for).value = toInput(new Date().toISOString()); break;
    case "wait": S.edit.wait = t.dataset.v; document.querySelectorAll("#fWait .chip").forEach((c) => c.classList.toggle("on", c === t));
      $("#fWaitOther").hidden = S.edit.wait !== "Другое"; if (S.edit.wait === "Другое") $("#fWaitOther").focus();
      if (!$("#fReady").value) $("#fReady").value = toInput(new Date().toISOString()); break;
    case "unready": S.edit.wait = ""; document.querySelectorAll("#fWait .chip").forEach((c) => c.classList.remove("on"));
      $("#fWaitOther").hidden = true; $("#fReady").value = ""; break;
    case "savejob": saveJob(false); break;
    case "exit": saveJob(true); break;
    case "deljob": if (confirm("Удалить запись? У механика она тоже пропадёт.")) { const j = S.edit.j;
      enqueue(j.client_id || null, { deleted: true }, false, j.id.startsWith("q:") ? null : j.id); closeSheet(); } break;
    case "seen": S.seen = Date.now(); save("rz_seen", S.seen); document.title = "Ремзона ГЕ"; render(); break;
    case "notif": await Notification.requestPermission(); render(); break;
    case "install": if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; render(); } break;
    case "hintoff": save("rz_hint_off", true); render(); break;
    case "role": document.querySelectorAll("#nsRole .chip").forEach((c) => c.classList.toggle("on", c === t)); break;
    case "genpin": $("#nsPin").value = randPin(); break;
    case "addstaff": {
      const name = $("#nsName").value.trim(), pin = $("#nsPin").value.trim(), role = document.querySelector("#nsRole .chip.on").dataset.v;
      if (!name || !/^\d{4}$/.test(pin)) return toast("Нужны фамилия и PIN из 4 цифр", true);
      t.disabled = true; const r = await callAdmin({ action: "create", name, role, pin }); t.disabled = false;
      if (r.error) return toast(r.error, true);
      toast(`${name} добавлен. PIN: ${pin}`); reloadStaff(); break;
    }
    case "pin": { const s = S.staff.find((x) => x.id === t.dataset.id); const pin = prompt(`Новый PIN для ${s.name} (4 цифры):`, randPin());
      if (pin === null) return; if (!/^\d{4}$/.test(pin)) return toast("PIN — 4 цифры", true);
      const r = await callAdmin({ action: "set_pin", id: s.id, pin }); toast(r.error || `PIN для ${s.name}: ${pin}`, !!r.error); break; }
    case "active": { const r = await callAdmin({ action: "set_active", id: t.dataset.id, active: t.dataset.on === "1" });
      if (r.error) toast(r.error, true); else if (!$("#sheet").hidden) closeSheet(); reloadStaff(); break; }
    case "staff": openStaff(t.dataset.id); break;
    case "serole": S.edit.role = t.dataset.v; document.querySelectorAll("#seRole .chip").forEach((c) => c.classList.toggle("on", c === t)); break;
    case "savestaff": { const s = S.edit.staff, name = $("#seName").value.trim();
      if (!name) return toast("Укажите фамилию", true);
      t.disabled = true; const r = await callAdmin({ action: "update", id: s.id, name, role: S.edit.role }); t.disabled = false;
      if (r.error) return toast(r.error, true);
      if (s.id === S.me.id) { S.me.name = name; save("rz_me", S.me); $("#whoName").textContent = name; }
      toast(`${name}: сохранено`); closeSheet(); reloadStaff(); break; }
    case "delstaff": { const s = S.edit.staff;
      if (!confirm(`Удалить «${s.name}» насовсем? Войти он больше не сможет, восстановить нельзя.`)) return;
      t.disabled = true; const r = await callAdmin({ action: "delete", id: s.id }); t.disabled = false;
      if (r.error) return toast(r.error, true);
      toast(`${s.name} удалён`); closeSheet(); reloadStaff(); break; }
    case "car": { const m = S.machines.find((x) => x.gar === t.dataset.gar);
      const r = await sb.from("machines").update({ active: !m.active }).eq("gar", m.gar);
      if (r.error) return toast(r.error.message, true); m.active = !m.active; save("rz_machines", S.machines); render(); break; }
    case "addcar": { const gar = $("#ncGar").value.trim(), model = $("#ncModel").value;
      if (!/^\d{3,4}$/.test(gar)) return toast("Гаражный номер — 3–4 цифры", true);
      const r = await sb.from("machines").upsert({ gar, model, active: true });
      if (r.error) return toast(r.error.message, true);
      const m = S.machines.find((x) => x.gar === gar); if (m) { m.active = true; m.model = model; } else S.machines.push({ gar, model, active: true });
      S.machines.sort((x, y) => x.gar.localeCompare(y.gar, "ru", { numeric: true })); save("rz_machines", S.machines); toast(`Машина ${gar} добавлена`); render(); break; }
  }
});
document.addEventListener("keydown", (e) => {
  if (!S.me && L.pick && /^\d$/.test(e.key) && L.pin.length < 4) { L.pin += e.key; renderLogin(); if (L.pin.length === 4) tryPin(); }
  if (e.key === "Enter" && e.target.id === "lName") findName();
  if (e.key === "Escape" && !$("#sheet").hidden) closeSheet();
});
$("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") closeSheet(); });

// связь появилась / приложение снова на экране -- отправить очередь и обновить
async function refresh() { if (!S.me || !navigator.onLine) return; flush(); try { await loadAll(); render(); } catch {} }
window.addEventListener("online", () => { renderConn(); refresh(); if (S.me) subscribe(); });
window.addEventListener("offline", renderConn);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { refresh(); } });
setInterval(() => { if (S.me && $("#sheet").hidden) render(); }, 60000);   // длительность «на площадке»
setInterval(refresh, 120000);
sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT" && S.me) showLogin(); });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
$("#outBtn").innerHTML = svg(ICON.out); applyTheme();
enter();
</script>
</body>
</html>
