  --press: rgba(118,118,128,.16); --disabled: rgba(118,118,128,.08); --scrim: rgba(0,0,0,.4); --shadow: none;
  --green: #248A3D; --green-soft: rgba(52,199,89,.15); --amber: #C96400; --amber-soft: rgba(255,149,0,.15);

    --muted: rgba(235,235,245,.6); --muted2: rgba(235,235,245,.3); --chip: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.36);
    --press: rgba(118,118,128,.28); --disabled: rgba(118,118,128,.12); --scrim: rgba(0,0,0,.6); --shadow: none;
    --green: #30D158; --green-soft: rgba(48,209,88,.18); --amber: #FF9F0A; --amber-soft: rgba(255,159,10,.18);

.big:active { opacity: .8; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

#sheet { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }

// ---------- очередь записи (без связи копится, уходит при появлении) ----------
function saveQ() { save("rz_queue", S.queue); renderConn(); }
function enqueue(cid, data, isNew, id) {
  const ex = S.queue.find((q) => (cid ? q.cid === cid : !q.cid && q.id === id));
  if (ex) Object.assign(ex.data, data); else S.queue.push({ cid, id, isNew, data });
  saveQ(); render(); flush();
}
// истёк вход (JWT) -- запись не теряем, повторим после обновления входа
const authErr = (r) => r.status === 401 || /^PGRST30/.test(r.error?.code || "");
// одна отправка за раз; refresh ждёт её, прежде чем перечитать записи (иначе только что отправленная пропала бы до обновления)
function flush() {
  if (!S.flushing && S.queue.length && S.me) S.flushing = sendQueue();
  return S.flushing || Promise.resolve();
}
async function sendQueue() {
  try {
    // без действующего входа сервер отказал бы и запись пропала -- ждём, вход обновится сам, когда будет связь
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return;
    while (S.queue.length) {
      const q = S.queue[0], sent = JSON.stringify(q.data); let res;
      if (q.isNew) res = await sb.from("jobs").upsert({ ...q.data, client_id: q.cid }, { onConflict: "client_id" }).select().single();
      else if (q.cid) res = await sb.from("jobs").update(q.data).eq("client_id", q.cid).select().single();
      else res = await sb.from("jobs").update(q.data).eq("id", q.id).select().single();
      if (res.error) {
        // сбой сервера (5xx), перегрузка, таймаут -- запись не терять, повторить (04.11.2026: раньше такая запись пропадала из очереди)
        if (netErr(res.error) || authErr(res) || res.status >= 500 || res.status === 429 || res.status === 408) break;
        // PGRST116 -- записи на сервере уже нет (удалили / убрана после переноса в книгу)
        toast(res.error.code === "PGRST116" && !q.isNew ? `${q.data.gar || "Запись"}: запись уже удалена — изменения не сохранены`
          : "Не сохранено (" + (q.data.gar || "") + "): " + res.error.message, true);
      } else if (res.data.deleted && !q.data.deleted) {
        toast(`${res.data.gar}: запись уже удалена — изменения не сохранены`, true); S.jobs.delete(res.data.id);
      } else {
        S.jobs.set(res.data.id, res.data);
        if (S.edit?.j?.id === res.data.id) S.edit.rev = res.data.rev;   // своё изменение, ушедшее при открытой карточке, -- не «чужое»
        // пока запрос шёл, запись дополнили -- дополнение отправить следующим запросом, а не потерять
        if (JSON.stringify(q.data) !== sent) { q.isNew = false; saveQ(); continue; }
      }
      S.queue.shift(); saveQ();
    }
  } finally { S.flushing = null; cacheJobs(); renderConn(); renderSoft(); retryLater(); }
}
// пока очередь не пуста -- повтор через 5 с, 10, 20 … 60 с: связь вернулась -- уходит в ближайшую попытку
let retryT = null, retryMs = 5000;
function retryLater(now) {
  if (now || !S.queue.length) { clearTimeout(retryT); retryT = null; retryMs = 5000; }
  if (now) return flush();
  if (retryT || !S.queue.length) return;
  retryT = setTimeout(() => { retryT = null; retryMs = Math.min(retryMs * 2, 60000); flush(); }, retryMs);
}
// записи с учётом неотправленного
function allJobs() {
  const m = new Map(S.jobs);
  for (const q of S.queue) {
    let j = [...m.values()].find((x) => (q.cid && x.client_id === q.cid) || (q.id && x.id === q.id));
    if (j) m.set(j.id, { ...j, ...q.data, pending: true });
    else if (q.isNew) m.set("q:" + q.cid, { id: "q:" + q.cid, client_id: q.cid, mechanic_id: S.me?.id, mechanic_name: S.me?.name,
      rev: 1, imported_rev: 0, updated_at: new Date().toISOString(), ...q.data, pending: true });
  }
  return [...m.values()].filter((j) => !j.deleted);
}
const cacheJobs = () => save("rz_jobs", [...S.jobs.values()]);

async function loadAll() {
  // без действующего входа сервер отдал бы пустые списки -- экран и кэш остались бы без машин и записей

  if (!session) return;
  const since =new Date(Date.now() - KEEP_DAYS * 86400000).toISOString();

function subscribe() {
  if (S.channel) sb.removeChannel(S.channel);
  const tok = S.rtTok = uuid();   // сообщение о закрытии прежнего канала не должно менять состояние нового
  S.channel = sb.channel("jobs-" + uuid()).on("postgres_changes", { event: "*", schema: "public", table: "jobs" }, (p) => {
    if (p.eventType === "DELETE") { S.jobs.delete(p.old?.id); }
    else {
      const row = p.new, prev = S.jobs.get(row.id);
      if (row.deleted) S.jobs.delete(row.id); else S.jobs.set(row.id, row);
      if (!row.deleted && (!prev || prev.rev !== row.rev)) announce(row, prev);
    }
    cacheJobs(); renderSoft();
  }).on("postgres_changes", { event: "*", schema: "public", table: "photos" }, (p) => {
    if (p.eventType === "DELETE") dropPhoto(p.old?.id); else if (p.new.job_id) addPhoto(p.new);
    renderSoft(); drawPhotos();
  }).subscribe((status) => { if (tok === S.rtTok) { S.rt = status; renderConn(); } });
  // кто сейчас в приложении (Realtime Presence): в канале участка только id сотрудника, имена -- из списка у администратора
  if (S.pres) sb.removeChannel(S.pres);
  const pres = S.pres = sb.channel("online-" + S.me.site, { config: { presence: { key: S.me.id } } })
    .on("presence", { event: "sync" }, () => {
      S.online = new Set(Object.keys(pres.presenceState()));
      if (isAdmin() && !document.activeElement?.matches("input, textarea")) render();
    }).subscribe((st) => { if (st === "SUBSCRIBED") pres.track({}); });
}

    case "signup": signup(); break;
    case "tosignup": L.mode = "signup"; L.err = ""; renderLogin(); break;
    case "tologin": L.mode = ""; L.err = ""; L.pin = ""; renderLogin(); break;
    case "newcode": if (!confirm("Сделать новый код? Старая ссылка перестанет работать (уже зарегистрированных это не касается).")) return;
    // fallthrough
    case "invite": {
      if (!S.invite || a === "newcode") { const r = await callAdmin({ action: "new_code" }); if (r.error) return toast(r.error, true); S.invite = r.code; render(); return toast(`Код ${r.code} готов — нажмите «Поделиться»`); }
      const url = location.origin + location.pathname + "?join=" + S.invite;
      if (navigator.share) navigator.share({ title: "Ремзона ГЕ", text: `Регистрация в приложении «Ремзона ГЕ». Код приглашения: ${S.invite}`, url }).catch(() => {});
      else navigator.clipboard?.writeText(url).then(() => toast("Ссылка скопирована"), () => prompt("Ссылка для сотрудников:", url));
      break; }
    case "approve": case "reject": { const s = S.staff.find((x) => x.id === t.dataset.id);
      if (a === "reject" && !confirm(`Отклонить заявку «${s.name}»?`)) return;
      t.disabled = true; const r = await callAdmin({ action: a, id: s.id }); t.disabled = false;
      toast(r.error || (a === "approve" ? `${s.name}: доступ открыт` : `Заявка «${s.name}» отклонена`), !!r.error); reloadStaff(); break; }
    case "wk": case "stsame": { const i = +t.closest(".work").dataset.i, w = S.edit.steps[i];
      const add = a === "stsame" ? (i ? S.edit.steps[i - 1].who : load("rz_wk_last", [])).filter((n) => !w.who.includes(n)) : w.who.includes(t.dataset.n) ? [] : [t.dataset.n];
      if (a === "wk" && !add.length) w.who.splice(w.who.indexOf(t.dataset.n), 1);
      else if (add.includes(REP)) { w.who.length = 0; add.splice(0, add.length, REP); }   // представители -- без фамилий
      else if (add.length) { const k = w.who.indexOf(REP); if (k >= 0) w.who.splice(k, 1); }
      if (people([...w.who, ...add]).length > ST_CREW) return toast(`В тех. отчёте на одну работу — до ${ST_CREW} человек. Разделите на две работы.`, true);
      w.who.push(...add);
      const q = stBox(i).querySelector('[data-sf="wq"]'); if (add.length) q.value = "";
      drawStWho(i); drawStRows(); break; }
    case "stadd": { const p = S.edit.steps.at(-1);   // следующая работа -- с окончания предыдущей, те же люди
      S.edit.steps.push({ t: "", from: p?.to || "", to: "", who: [...(p?.who || [])] }); drawSteps();
      stBox(S.edit.steps.length - 1).querySelector("textarea").focus(); break; }
    case "stdel": { const i = +t.closest(".work").dataset.i, w = S.edit.steps[i];
      if ((w.t || w.who.length) && !confirm(`Убрать работу ${i + 1}${w.t ? " «" + w.t.slice(0, 40) + "»" : ""}?`)) return;
      S.edit.steps.splice(i, 1); drawSteps(); break; }
    case "stfrom": case "stto": setStTime(+t.closest(".work").dataset.i, a === "stfrom" ? "from" : "to", hhmm()); break;
    case "tpick": openTp(t); break;
    case "tpcancel": closeTp(); break;
    case "tpdone": doneTp(); break;
    case "tpclear": if (TP.f) setStTime(TP.i, TP.f, ""); else { $("#" + TP.id).value = ""; tShow(TP.id); } closeTp(); break;
    case "stpick": { const i = +t.closest(".work").dataset.i, w = S.edit.steps[i], box = stBox(i), ta = box.querySelector("textarea");
      w.t = w.t.trim() ? w.t.trim() + "; " + t.dataset.v : t.dataset.v; ta.value = w.t; fitTa(ta);
      box.querySelector('[data-sf="q"]').value = ""; drawStSug(i); break; }
    case "wkadd": { const name = fio($("#nwName").value), grp = $("#nwGrp").value;
      if (!name) return toast(FIO_ERR, true);
      const r = await sb.from("workers").upsert({ name, grp, active: true }, { onConflict: "name" }).select().single();
      if (r.error) return toast(r.error.message, true);
      S.workers = [...S.workers.filter((w) => w.name !== name), r.data].sort((a, b) => a.name.localeCompare(b.name, "ru"));
      save("rz_workers", S.workers); $("#nwName").value = ""; toast(`${name} — в списке исполнителей`); render(); break; }
    case "wkact": { const w = S.workers.find((x) => x.id === t.dataset.id);
      const r = await sb.from("workers").update({ active: !w.active }).eq("id", w.id);
      if (r.error) return toast(r.error.message, true);
      w.active = !w.active; save("rz_workers", S.workers); drawWkAdmin(); break; }
    case "logout": if (confirm("Выйти из приложения?")) { if (S.queue.length && !confirm(`Не отправлено записей: ${S.queue.length}. Они останутся на этом телефоне. Выйти?`)) return;
      if (S.channel) sb.removeChannel(S.channel); if (S.pres) sb.removeChannel(S.pres); await pushOff(); await sb.auth.signOut(); localStorage.removeItem("rz_me"); S.past = null; showLogin(); } break;
    case "tab": S.tab = t.dataset.tab; render(); scrollTo(0, 0); break;
    case "view": S.view = t.dataset.v; render(); scrollTo(0, 0); break;
    case "pastpick": S.found = null; openPastPick(); break;
    case "foundjob": openJob(t.dataset.id, S.found.jobs); break;
    case "foundback": S.edit = null; openPastPick(); break;
    case "pastgo": openPast(+t.dataset.st); break;
    case "pastback": S.past = null; render(); scrollTo(0, 0); break;
    case "pastarea": S.past.area = t.dataset.v; render(); break;
    case "theme": save("rz_theme", isDark() ? "light" : "dark"); applyTheme(); break;
    case "new": openJob(null); break;
    case "job": openJob(t.dataset.id); break;
    case "close": closeSheet(); break;
    case "photo": { const p = findPhoto(t.dataset.id); if (p) viewPhoto(p); break; }
    case "pclose": $("#pview").hidden = true; break;
    case "psave": savePhoto(t.dataset.id); break;
    case "pdel": delPhoto(t.dataset.id); break;
    case "gar": S.edit.gar = t.dataset.gar; $("#fGar").value = S.edit.gar; drawGars(); break;
    case "insp": { const e = S.edit, k = t.dataset.k; if (e.insp[k] === t.dataset.v) delete e.insp[k]; else e.insp[k] = t.dataset.v; drawInsp(); break; }
    case "area": S.edit.area = t.dataset.v; document.querySelectorAll("#fArea .chip").forEach((c) => c.classList.toggle("on", c === t)); drawInsp();
      if (S.edit.j || S.edit.kindSet) break;   // новая запись, вид не выбирали сами -- вид по вкладке
      S.edit.kind = S.edit.area === "ТО" ? "ТО" : "Ремонт"; document.querySelectorAll("#fKind .chip").forEach((c) => c.classList.toggle("on", c.dataset.v === S.edit.kind)); drawTo(); break;
    case "kind": S.edit.kind = t.dataset.v; S.edit.kindSet = true; document.querySelectorAll("#fKind .chip").forEach((c) => c.classList.toggle("on", c.dataset.v === S.edit.kind)); drawTo(); break;
    case "to": { $("#more")?.setAttribute("open", ""); const w = S.edit.steps[0], ta = stBox(0).querySelector("textarea");
      w.t = !/^ТО-\d/.test(w.t) ? (t.dataset.v + " " + w.t).trim() : w.t.replace(/^ТО-\d/, t.dataset.v); ta.value = w.t; break; }
    case "now": $("#" + t.dataset.for).value = toInput(new Date().toISOString()); tShow(t.dataset.for); break;
    case "wait": S.edit.wait = t.dataset.v; document.querySelectorAll("#fWait .chip").forEach((c) => c.classList.toggle("on", c === t));
      $("#fWaitOther").hidden = S.edit.wait !== "Другое"; if (S.edit.wait === "Другое") $("#fWaitOther").focus();
      if (!$("#fReady").value) { $("#fReady").value = toInput(new Date().toISOString()); tShow("fReady"); } break;
    case "unready": S.edit.wait = ""; document.querySelectorAll("#fWait .chip").forEach((c) => c.classList.remove("on"));
      $("#fWaitOther").hidden = true; $("#fReady").value = ""; tShow("fReady"); break;
    case "savejob": saveJob(false); break;
    case "exit": saveJob(true); break;
    // удалить может администратор и механик -- свою запись (внёс по ошибке); чужую сервер не даст (jobs_before)
    case "trash": openTrash(); break;
    case "restore": restoreJob(t.dataset.id); break;
    case "deljob": { const j = S.edit.j; if (!confirm(`Удалить запись по машине ${j.gar}? Она пропадёт у всех. Вернуть можно ${TRASH_DAYS} суток — «Недавно удалённые» внизу экрана.`)) return;
      enqueue(j.client_id || null, { deleted: true }, false, j.id.startsWith("q:") ? null : j.id); closeSheet(); toast(`${j.gar}: запись удалена`); break; }
    case "seen": S.seen = Date.now(); save("rz_seen", S.seen); document.title = "Ремзона ГЕ"; render(); break;
    case "notif": if (pushOk()) await pushOn(true).catch((e) => toast("Уведомления: " + (e.message || e), true));
      else await Notification.requestPermission();
      if (Notification.permission === "denied") toast("Уведомления запрещены в настройках телефона", true);
      render(); break;
    case "install": if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; render(); } break;
    case "hintoff": save("rz_hint_off", true); render(); break;
    case "role": S.nsRole = t.dataset.v; document.querySelectorAll("#nsRole .chip").forEach((c) => c.classList.toggle("on", c === t)); break;
    case "genpin": $("#nsPin").value = randPin(); break;
    case "addstaff": {
      const name = fio($("#nsName").value), pin = $("#nsPin").value.trim(), role = document.querySelector("#nsRole .chip.on").dataset.v;
      if (!name) return toast(FIO_ERR, true);
      if (!/^\d{4}$/.test(pin)) return toast("PIN — ровно 4 цифры", true);
      t.disabled = true; const r = await callAdmin({ action: "create", name, role, pin }); t.disabled = false;
      if (r.error) return toast(r.error, true);
      $("#nsName").value = ""; $("#nsPin").value = ""; S.nsRole = "";
      toast(`${name} добавлен. PIN: ${pin}`); reloadStaff(); break;
    }
    case "pin": { const s = S.staff.find((x) => x.id === t.dataset.id); const pin = prompt(`Новый PIN для ${s.name} (4 цифры):`, randPin());
      if (pin === null) return; if (!/^\d{4}$/.test(pin)) return toast("PIN — 4 цифры", true);
      const r = await callAdmin({ action: "set_pin", id: s.id, pin }); toast(r.error || `PIN для ${s.name}: ${pin}`, !!r.error); break; }
    case "active": { const r = await callAdmin({ action: "set_active", id: t.dataset.id, active: t.dataset.on === "1" });
      if (r.error) toast(r.error, true); else if (!$("#sheet").hidden) closeSheet(); reloadStaff(); break; }
    case "staff": openStaff(t.dataset.id); break;
    case "serole": S.edit.role = t.dataset.v; document.querySelectorAll("#seRole .chip").forEach((c) => c.classList.toggle("on", c === t)); break;
    case "savestaff": { const s = S.edit.staff, newSite = S.edit.site, typed = $("#seName").value.trim();
      // прежнее имя не трогаем (правят роль / участок), новое -- только «Фамилия И.О.»
      const name = typed === s.name ? typed : fio(typed);
      if (!name) return toast(FIO_ERR, true);
      t.disabled = true; const r = await callAdmin({ action: "update", id: s.id, name, role: S.edit.role, site: S.edit.site }); t.disabled = false;
      if (r.error) return toast(r.error, true);
      if (s.id === S.me.id) { S.me.name = name; save("rz_me", S.me); $("#whoName").textContent = name; }
      toast(`${name}: сохранено`); closeSheet();
      if (s.id === S.me.id && newSite !== S.me.site) await moveSite(newSite, true); else reloadStaff();
      break; }
    case "sesite": S.edit.site = t.dataset.v; document.querySelectorAll("#seSite .chip").forEach((c) => c.classList.toggle("on", c === t)); break;
    case "ssite": L.site = t.dataset.v; document.querySelectorAll("#sSite button").forEach((c) => c.classList.toggle("on", c === t)); break;
    case "site": openSite(); break;
    case "chatmsg": openChatMsg(t.dataset.area); break;
    case "chatcopy": copyChatMsg(); break;
    case "chatshare": navigator.share({ text: $("#chatTxt").value }).catch(() => {}); break;
    case "shift": pickShift(+t.dataset.v); break;
    case "tmc": { const r = PRICE.rows[+t.dataset.i], qty = Math.max(1, parseInt($("#fTmcN").value, 10) || 1), ta = $("#fTmc");
      ta.value = (ta.value.trim() ? ta.value.trim() + "\n" : "") + `${r.a} ${r.n} — ${qty} шт`;   // как окно ТМЦ книги
      fitTa(ta);
      $("#fTmcQ").value = ""; $("#fTmcN").value = "1"; $("#tmcList").innerHTML = ""; break; }
    case "setsite": closeSheet(); if (t.dataset.v !== S.me.site) moveSite(t.dataset.v); break;
    case "delstaff": { const s = S.edit.staff;
      if (!confirm(`Удалить «${s.name}» насовсем? Войти он больше не сможет, восстановить нельзя.`)) return;
      t.disabled = true; const r = await callAdmin({ action: "delete", id: s.id }); t.disabled = false;
      if (r.error) return toast(r.error, true);
      toast(`${s.name} удалён`); closeSheet(); reloadStaff(); break; }
    case "car": { const m = S.machines.find((x) => x.gar === t.dataset.gar);
      const r = await sb.from("machines").update({ active: !m.active }).eq("gar", m.gar);
      if (r.error) return toast(r.error.message, true); m.active = !m.active; save("rz_machines", S.machines); render(); break; }
    case "addcar": { const gar = $("#ncGar").value.trim(), model = $("#ncModel").value;
      if (!/^\d{3,4}$/.test(gar)) return toast("Гаражный номер — 3–4 цифры", true);
      const r = await sb.from("machines").upsert({ gar, model, active: true });
      if (r.error) return toast(r.error.message, true);
      const m = S.machines.find((x) => x.gar === gar); if (m) { m.active = true; m.model = model; } else S.machines.push({ gar, model, active: true });
      S.machines.sort((x, y) => x.gar.localeCompare(y.gar, "ru", { numeric: true })); save("rz_machines", S.machines); $("#ncGar").value = ""; toast(`Машина ${gar} добавлена`); render(); break; }
  }
});
document.addEventListener("keydown", (e) => {
  if (!S.me && L.pick && /^\d$/.test(e.key) && L.pin.length < 4) { L.pin += e.key; renderLogin(); if (L.pin.length === 4) tryPin(); }
  if (e.key === "Enter" && e.target.id === "lName") findName();
  if (e.key === "Escape" && !$("#tpick").hidden) return closeTp();
  if (e.key === "Escape" && !$("#pview").hidden) return void ($("#pview").hidden = true);
  if (e.key === "Escape" && !$("#sheet").hidden) closeSheet();
});
// случайное касание мимо листа не закрывает заполняемую карточку (вписанное пропало бы); закрыть -- «Отмена»
$("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet" && !S.edit?.can) closeSheet(); });
// сбой в коде -- сообщение на экране, а не молчаливо несработавшая кнопка (ошибки связи показывают сами действия)
const showBug = (e) => { const m = String(e?.message || e || ""); if (m && !netErr(e) && !/ResizeObserver|Script error/i.test(m)) toast("Ошибка: " + m, true); };
window.addEventListener("error", (e) => showBug(e.error || e.message));
window.addEventListener("unhandledrejection", (e) => showBug(e.reason));
$("#tpick").addEventListener("click", (e) => { if (e.target.id === "tpick") closeTp(); });
$("#pview").addEventListener("click", (e) => { if (e.target.id === "pview") e.target.hidden = true; });

// связь появилась / приложение снова на экране -- отправить очередь и обновить
async function refresh() {
  if (!S.me || !navigator.onLine) return;
  await retryLater(true);
  try { await loadAll(); renderSoft(); } catch {}
  loadPrice(); markSeen(); liveAgain(); checkUpdate();
  // приложение подолгу открыто (ПК, телефон на зарядке): новая версия -- как только никто не заполняет форму и очередь пуста
  const a = document.activeElement;
  if (S.update && $("#sheet").hidden && !S.queue.length && !S.past && !a?.matches?.("input, select, textarea")) location.reload();
}
// онлайн-обновления: запуск без связи или канал оборвался -- подключить снова (иначе данные только раз в 2 минуты и «подключение…» в шапке)
async function liveAgain() {
  if (S.rt === "SUBSCRIBED" || S.rtTry) return;
  S.rtTry = true;
  try { const { data: { session } } = await sb.auth.getSession(); if (session && S.me) subscribe(); }
  finally { setTimeout(() => { S.rtTry = false; }, 20000); }   // подключение идёт несколько секунд -- не начинать заново
}
// раз в час -- есть ли новая версия сайта: sw.js сравнит страницу и пришлёт «updated» (иначе приложение, которое не закрывают, остаётся старым)
function checkUpdate() {
  if (!navigator.serviceWorker?.controller || Date.now() - (S.updAt || 0) < 3600000) return;
  S.updAt = Date.now(); fetch("index.html?check=1").catch(() => {});
}
// «был в приложении N мин назад» у администратора: при входе и каждом обновлении (раз в 2 мин, пока приложение на экране)
function markSeen() { if (S.me && !document.hidden) sb.rpc("seen").then(() => {}, () => {}); }
window.addEventListener("online", () => { renderConn(); refresh(); if (S.me) subscribe(); });
window.addEventListener("offline", renderConn);
// новая версия сайта скачана в фоне (sw.js) -- применяется, когда приложение снова открыли и форма не открыта
navigator.serviceWorker?.addEventListener("message", (e) => { if (e.data?.type === "updated") S.update = true; });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (S.update && $("#sheet").hidden && !S.queue.length) return location.reload();
  refresh();
});
setInterval(() => { if (S.me && $("#sheet").hidden) renderSoft(); }, 60000);   // длительность «на площадке»
setInterval(refresh, 120000);
sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT" && S.me) showLogin(); });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
$("#outBtn").innerHTML = svg(ICON.out); applyTheme();
enter();
</script>
</body>
